# Releases a new version when a version tag is pushed:
#
#   git tag v0.2.2 && git push --tags
#
# 1. Checks the tag matches the version in pyproject.toml, mnemolith/__init__.py and server.json. The Claude Code
#    plugin (plugin/) is bumped after the release is on PyPI, since its lockfile needs the release to exist.
# 2. Builds the package and smoke-tests it (installs it and checks `mnemolith --version`), plus the final
#    `aether-cache` release that points people to Mnemolith (the project's earlier name).
# 3. Publishes to PyPI with trusted publishing (no token: PyPI trusts this workflow).
# 4. Publishes to the official MCP Registry (GitHub OIDC login, no token).
# 5. Creates the GitHub Release with the built files attached.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to exact commits (the version is in the comment), so a moved tag can't change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag matches every version number
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PYPROJECT=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          INIT=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' mnemolith/__init__.py)
          SERVER=$(jq -r '.version' server.json)
          PACKAGE=$(jq -r '.packages[0].version' server.json)
          echo "tag=$TAG pyproject=$PYPROJECT __init__=$INIT server.json=$SERVER/$PACKAGE"
          for v in "$PYPROJECT" "$INIT" "$SERVER" "$PACKAGE"; do
            if [ "$v" != "$TAG" ]; then
              echo "::error::Version mismatch: the tag says $TAG, but the files say pyproject=$PYPROJECT, __init__=$INIT, server.json=$SERVER/$PACKAGE. Update them all, then tag again."
              exit 1
            fi
          done

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Check the plugin's lockfile matches the plugin's pinned version
        run: cd plugin && uv lock --check

      - name: Build
        run: |
          uv build
          # the last `aether-cache` release (the project's earlier name), pointing people to Mnemolith.
          # Its version never changes, so PyPI keeps the first upload and later releases skip it.
          uv build legacy/aether-cache --out-dir dist

      - name: Smoke test the built package
        run: |
          uv venv /tmp/check
          uv pip install --python /tmp/check/bin/python dist/mnemolith-*.whl
          /tmp/check/bin/mnemolith --version | tee /tmp/version.txt
          grep -q "mnemolith ${GITHUB_REF_NAME#v}$" /tmp/version.txt
          unzip -l dist/mnemolith-*.whl | grep -q "mnemolith/engine/mnemolith-engine.jar"
          uv pip install --python /tmp/check/bin/python dist/aether_cache-*.whl
          /tmp/check/bin/aether-cache | grep -q "Aether Cache is now Mnemolith"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true # the final aether-cache release is only uploaded once

  mcp-registry:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write # GitHub OIDC login to the registry
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Wait for PyPI to serve the new version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 30); do
            if curl -fsS "https://pypi.org/pypi/mnemolith/$VERSION/json" | grep -q "mcp-name: io.github.anishchugh05/mnemolith"; then
              echo "PyPI has $VERSION"; exit 0
            fi
            sleep 10
          done
          echo "::error::PyPI didn't show version $VERSION with the mcp-name line within 5 minutes."
          exit 1

      - name: Install mcp-publisher
        # A fixed version, checked against its SHA-256 before it runs, so a changed download can't publish anything.
        # To update: pick a release at github.com/modelcontextprotocol/registry/releases and copy the
        # mcp-publisher_linux_amd64.tar.gz line from its registry_<version>_checksums.txt (ubuntu-latest is x86_64).
        env:
          MCP_PUBLISHER_VERSION: v1.8.9
          MCP_PUBLISHER_SHA256: 4d527ca8f1ced0394c962dc925c2a4a4addef441cbefd62501c875e9481823a8
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: Log in to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to the MCP Registry
        run: ./mcp-publisher publish

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: dist/mnemolith-*
          generate_release_notes: true
