# Pins the exact Mnemolith release this plugin runs, plus every dependency (with hashes) in uv.lock.
# Claude Code starts the server with `uvx mnemolith==<version>`; this lock records the exact versions and hashes.
[project]
name = "mnemolith-plugin"
version = "0.3.3"
requires-python = ">=3.10"
dependencies = ["mnemolith==0.3.3"]

[tool.uv]
package = false
