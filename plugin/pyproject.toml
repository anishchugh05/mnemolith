# Pins the exact Mnemolith release this plugin runs, plus every dependency (with hashes) in uv.lock.
# Claude Code starts the server with `uv run --locked`, so nothing outside this lock is installed.
[project]
name = "mnemolith-plugin"
version = "0.3.2"
requires-python = ">=3.10"
dependencies = ["mnemolith==0.3.2"]

[tool.uv]
package = false
